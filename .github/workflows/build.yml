name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Un tag desalineado con versionName publicaría un APK que se identifica
      # con otro número en Ajustes > Apps; mejor romper el CI aquí.
      - name: Guard tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE_VER="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          if [ "$TAG" != "$GRADLE_VER" ]; then
            echo "::error::El tag ($TAG) no coincide con versionName ($GRADLE_VER) en app/build.gradle.kts"
            exit 1
          fi

      # One invocation: configuración cacheada una sola vez y tareas en
      # paralelo (tests + debug + release) en vez de 3 arranques de Gradle.
      - name: Build all (tests, debug, release)
        run: >
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
          --no-daemon --parallel --configuration-cache
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ao3-reader-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ao3-reader-release
          path: app/build/outputs/apk/release/app-release*.apk

      # Sin el mapping, cualquier stack trace ofuscado de una build firmada es
      # indecifrable (el runner efímero lo borra al terminar el job).
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: ao3-reader-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: ao3-reader-release
          path: release-apk

      - name: Download R8 mapping
        uses: actions/download-artifact@v4
        with:
          name: ao3-reader-mapping
          path: mapping

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apk/*.apk
            mapping/mapping.txt
          generate_release_notes: true
