[versions]
androidGradle = "9.2.1"
kotlin = "2.4.0"
composeBom = "2026.06.01"
coreKtx = "1.19.0"
activityCompose = "1.9.3"
coroutines = "1.11.0"
jsoup = "1.22.2"
okhttp = "5.4.0"
cronet = "141.7340.3"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom-alpha", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
// cronet-embedded (not play-services-cronet): a single AAR with the full
// Chromium engine, no Google Play Services dependency, and no manifest
// namespace clash (play-services-cronet pulls cronet-api + cronet-shared,
// both declaring org.chromium.net, which fails AGP's manifest merger).
cronet-embedded = { module = "org.chromium.net:cronet-embedded", version.ref = "cronet" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradle" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
