org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 default true: fails the manifest merger when several AARs share a
# namespace (cronet-embedded publishes 5 artifacts, all 'org.chromium.net').
# The duplicate package is harmless at runtime (single merged APK).
android.uniquePackageNames=false
kotlin.code.style=official
